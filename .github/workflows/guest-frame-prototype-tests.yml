name: Guest Frame Prototype Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - save-state-frame-prototype
    paths:
      - 'include/rex/ppc/guest_call_stack.h'
      - 'include/rex/ppc/resumable_frame.h'
      - 'include/rex/ppc/resumable_program.h'
      - 'include/rex/codegen/resumable_function.h'
      - 'include/rex/string/numeric.h'
      - 'include/rex/chrono/chrono.h'
      - 'tests/unit/ppc/guest_call_stack_test.cpp'
      - 'tests/unit/ppc/resumable_frame_test.cpp'
      - 'tests/unit/catch2_compat.h'
      - 'tests/unit/CMakeLists.txt'
      - 'tests/ppc/asm/seq_aot_runtime.s'
      - 'tests/ppc/CMakeLists.txt'
      - 'cmake/ppc_test_pipeline.cmake'
      - 'src/rexglue/commands/test_recompiler.cpp'
      - 'resources/templates/test/ppc_test_functions_cpp.inja'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/guest-frame-prototype-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev cmake ninja-build build-essential libvulkan-dev \
            libgtk-3-dev libx11-xcb-dev libxss-dev libwayland-dev libwayland-bin \
            wayland-protocols libxkbcommon-dev libdecor-0-dev libasound2-dev \
            libpulse-dev libpipewire-0.3-dev

      - name: Verify C++23 toolchain
        run: |
          clang++-18 --version
          printf '#include <expected>\nint main() { std::expected<int, int> value = 1; return *value - 1; }\n' > /tmp/expected-check.cpp
          clang++-18 -std=c++23 -stdlib=libc++ /tmp/expected-check.cpp -o /tmp/expected-check
          /tmp/expected-check

      - name: Configure test build
        run: |
          cmake -S . -B out/build/guest-frame-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ \
            -DREXGLUE_BUILD_TESTS=ON \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_USE_VULKAN=ON

      - name: Build unit tests
        run: cmake --build out/build/guest-frame-tests --target unit_tests ppc_tests --parallel 2

      - name: Run guest frame tests
        run: |
          ctest --test-dir out/build/guest-frame-tests -R 'guest_call_stack|resumable_frame|aot_runtime_localized_gpr' --output-on-failure
